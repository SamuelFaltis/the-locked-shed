<title>The Locked Shed</title>

<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(100% 70% at 50% 0%,#5A4880,#2B2140 70%) #2B2140;color:#FFF8EE;font-family:"Nunito",system-ui,sans-serif;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px))}
.card{background:#FFFDF8;color:#4A3B52;border-radius:28px;padding:28px 24px;width:min(380px,100%);text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.lock{font-size:56px;line-height:1}
h1{font-family:"Baloo 2",system-ui,sans-serif;font-size:30px;margin:8px 0 4px}
p{margin:0 0 16px;color:#7A6A82}
input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid #EBDDF0;color:#4A3B52;background:#fff;text-align:center}
input:focus{outline:3px solid #FFE38A;border-color:#C9B6FF}
button{margin-top:12px;width:100%;border:none;background:linear-gradient(180deg,#FF9DBB,#FF7FA6);color:#fff;font-family:"Baloo 2",system-ui,sans-serif;font-size:20px;padding:12px;border-radius:16px;box-shadow:0 4px 0 #D9628A;cursor:pointer}
button:disabled{opacity:.6}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:14px;color:#7A6A82}
.err{color:#E0556F;min-height:1.4em;margin:10px 0 0;font-size:15px}
</style></head><body>
<form class="card" id="f" autocomplete="off">

  <p>A secret case for one detective only. Enter the password.</p>

  <button id="go" type="submit">Open the case</button>
  <label><input type="checkbox" id="rem" style="width:auto"> Remember on this device</label>
  <p class="err" id="err" role="alert"></p>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(ENC.s), iterations: 600000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}

  const key = await keyFrom(pw.trim().toLowerCase());

  return new TextDecoder().decode(plain);
}

  btn.disabled = true; btn.textContent = 'Opening…'; err.textContent = '';
  try {
    const html = await open(pw);
    if (document.getElementById('rem').checked) { try { localStorage.setItem(KEYNAME, pw.trim().toLowerCase()); } catch (e) {} }
    show(html);
  } catch (x) {
    err.textContent = 'Wrong password. Try again! 🐾'; btn.disabled = false; btn.textContent = 'Open the case';
  }
});
</script>
